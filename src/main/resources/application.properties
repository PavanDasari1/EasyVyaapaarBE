# ==========================================
# EasyVyaapaar - Application Configuration
# ==========================================

spring.application.name=easyvyaapaar-backend

# Server port (default 8081, overriden by PORT on Render)
server.port=${PORT:8081}

# ==========================================
# Database Configuration
# Defaults to H2 in-memory DB for instant zero-config deployment.
# Override DB_URL, DB_USERNAME, DB_PASSWORD environment variables for external MySQL.
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:easyvyaapaar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SQL Initialization (schema.sql + data.sql)
# ==========================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ==========================================
# Jackson JSON settings
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==========================================
# Logging
# ==========================================
logging.level.com.easyvyaapaar=INFO
logging.level.org.springframework.web=INFO
