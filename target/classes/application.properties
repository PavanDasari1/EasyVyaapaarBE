# ==========================================
# EasyVyaapaar - Application Configuration
# ==========================================

# Active profile (override with -Dspring.profiles.active=prod)
spring.profiles.active=dev

# Application name
spring.application.name=easyvyaapaar-backend

# Server port
server.port=8081

# ==========================================
# Database Configuration (override in dev/prod profiles)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/easyvyaapaar?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SQL Initialization (schema.sql + data.sql)
# ==========================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ==========================================
# Jackson JSON settings
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ==========================================
# CORS (override with env var in production)
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==========================================
# Logging
# ==========================================
logging.level.com.easyvyaapaar=DEBUG
logging.level.org.springframework.web=INFO
